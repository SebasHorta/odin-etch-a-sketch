<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etch-a-Sketch</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="fields">
        <div class="sizing-field">
            <label for="size">Size(max 100): </label>
            <input type="number" id="size" placeholder="16">
            <button id="submit">Submit</button>
        </div>
        <div class="styling-field">
            <span>Style:</span>
            <input type="radio" name="style" id="solid" value="solid" checked>
            <label for="solid">Solid</label>
            <input type="radio" name="style" id="gradual" value="gradual">
            <label for="gradual">Gradual</label>
            <input type="radio" name="style" id="color" value="color">
            <label for="color">Color</label>
        </div>
    </div>
    <div class="flex-container"></div>

</body>

</html>
